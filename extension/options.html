<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Manage Snippets | Text Expander – Snippets & Shortcuts</title></head><body><main class="wrap"><h1>Text Expander – Snippets & Shortcuts</h1><p class="muted">All data remains in this browser. No cloud account.</p><p><a href="about.html">About &amp; Privacy</a></p><section class="card"><h2 id="formTitle">Create snippet</h2><form id="form"><label>Title<input id="title" required maxlength="120" placeholder="Customer reply"></label><label>Shortcut<input id="shortcut" required placeholder="/reply"></label><label>Folder<input id="folder" placeholder="General"></label><label>Snippet text<textarea id="text" required placeholder="Hello! Thank you for contacting us."></textarea></label><button type="submit">Save snippet</button><button type="button" class="secondary" id="cancel">Clear</button></form><p class="muted">Placeholders: {date} {time} {datetime} {url} {domain}</p><p id="status" aria-live="polite"></p></section><section class="card"><h2>Your snippets</h2><input id="search" type="search" placeholder="Search by title, shortcut or folder"><div class="actions"><button id="export" type="button" class="secondary">Export JSON backup</button><button id="import" type="button" class="secondary">Import JSON backup</button><input id="upload" type="file" accept=".json,application/json" hidden></div><div id="list"></div></section></main><script src="options.js"></script></body></html>
