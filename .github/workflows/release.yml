name: Release Chrome Extension
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and JavaScript
        run: |
          python3 -m json.tool extension/manifest.json >/dev/null
          for file in extension/*.js; do node --check "$file"; done
      - name: Create installable ZIP
        run: |
          cd extension
          zip -r ../Masoom-Text-Expander-Chrome.zip . -x '*.DS_Store'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="manual-${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$TAG" Masoom-Text-Expander-Chrome.zip --title "Masoom Text Expander $TAG" --notes "Extract ZIP; Chrome Extensions > Developer mode > Load unpacked; select the extracted folder with manifest.json." --target "$GITHUB_SHA"
